name: Mobile Phase 1 CI

on:
  push:
    branches:
      - mobile/app-store-phase-1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  web-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
